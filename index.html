<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同い年の星図 — Same-Age Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<header class="top">
  <div class="brand"><span data-i18n="title"></span></div>
  <button id="lang" class="lang" type="button">EN</button>
</header>

<main>
  <section class="hero">
    <p class="tagline" data-i18n="tagline"></p>
    <div class="headline">
      <div class="big"><span id="bigAge">—</span><small id="bigUnit"></small></div>
      <ul id="compare" class="compare"></ul>
      <button id="share" class="share" type="button" data-i18n="share"></button>
      <span id="shareMsg" class="share-msg" role="status"></span>
    </div>
  </section>

  <section class="sky-wrap">
    <canvas id="sky"></canvas>
    <div id="tip" class="tip" hidden></div>
    <div class="slider">
      <input id="view" type="range" min="0" max="100" step="1" aria-label="age">
    </div>
    <p class="help"><span data-i18n="sky_help"></span> <span id="starCount" class="muted"></span></p>
    <div id="fields" class="chips"></div>
    <div class="search">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph">
      <ul id="hits" class="hits" hidden></ul>
    </div>
  </section>

  <section class="cols">
    <div class="col died"><h2 data-i18n="col_died"></h2><ul id="colDied"></ul></div>
    <div class="col now"><h2 data-i18n="col_now"></h2><ul id="colNow"></ul></div>
    <div class="col ahead"><h2 data-i18n="col_ahead"></h2><ul id="colAhead"></ul></div>
  </section>

  <section class="bars">
    <h2 data-i18n="lifebars"></h2>
    <svg id="lifebars" role="img"></svg>
  </section>
</main>

<div id="card" class="card-wrap" hidden>
  <article class="card" role="dialog" aria-modal="true">
    <button id="cardClose" class="close" type="button" aria-label="close">×</button>
    <div id="cardBody"></div>
  </article>
</div>

<footer class="foot">Data: hand-curated + <a href="https://www.wikidata.org/">Wikidata</a> (CC0) · Descriptions of background stars: <a href="https://www.wikipedia.org/">Wikipedia</a> (CC BY-SA 4.0) · Fame: Wikipedia page views</footer>

<script src="i18n.js?v=14"></script>
<script src="app.js?v=14"></script>
</body>
</html>
